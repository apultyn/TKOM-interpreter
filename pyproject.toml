[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyscript-compiler"
version = "1.0.0"

[tool.setuptools.packages.find]
include = ["src*"]

[project.scripts]
psc = "src.main.main:main"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
addopts = "-q"
